name: Nifty Options Scanner

on:
  schedule:
    # Runs every 5 minutes from 4:00 AM to 10:00 AM UTC (9:30 AM to 3:30 PM IST), Mon-Fri
    - cron: '*/5 * * * *'
  workflow_dispatch: 

jobs:
  scan-market:
    runs-on: ubuntu-latest
    
    # FIX: Forces GitHub to use the newer Node 24 engine to silence the deprecation warning
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10' 

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute Moonshot Scanner
        env:
          UPSTOX_ACCESS_TOKEN: ${{ secrets.UPSTOX_ACCESS_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python moonshot.py